<div class="messages-container">
  <h3>Operation Log</h3>

  <button
    mat-button
    color="warn"
    [disabled]="messages.length === 0"
    (click)="messageService.clear()"
  >
    Clear
  </button>

  <div *ngIf="messages.length === 0">
    <p>No operation logs.</p>
  </div>

  <ul *ngIf="messages.length > 0">
    <li *ngFor="let message of messages">
      {{ message }}
    </li>
  </ul>
</div>
