<div class="messages-container" *ngIf="messageService.messages$ | async as msgs">
  <h3>Operation Log</h3>

  <button mat-button color="warn" [disabled]="msgs.length === 0" (click)="messageService.clear()">
    Clear
  </button>

  <div *ngIf="msgs.length === 0">
    <p>No operation logs.</p>
  </div>

  <ul *ngIf="msgs.length > 0">
    <li *ngFor="let message of msgs">
      {{ message }}
    </li>
  </ul>
</div>
