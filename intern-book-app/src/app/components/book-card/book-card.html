<mat-card class="book-card">
  <mat-card-content>
    <h3 class="book-title">
      {{ book.title }}
    </h3>

    <div class="book-description">
      {{ book.description }}
    </div>
    <div class="book-evaluation">評価点: {{ book.evaluation }}</div>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-button color="warn" (click)="onDelete()">削除</button>
  </mat-card-actions>
</mat-card>
