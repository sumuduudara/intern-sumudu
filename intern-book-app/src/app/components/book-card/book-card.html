<mat-card class="book-card">
  <mat-card-content>
    <div class="book-title">
      {{ book.name }}
    </div>

    <div class="book-description">
      {{ book.detail }}
    </div>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-button color="warn" (click)="onDelete()">削除</button>
  </mat-card-actions>
</mat-card>
