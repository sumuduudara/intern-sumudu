<div class="container">
  <mat-card class="form-card">
    <mat-card-content>
      <h2>書籍登録</h2>

      <mat-form-field appearance="outline">
        <input matInput placeholder="書籍名" [(ngModel)]="title" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <textarea matInput rows="3" placeholder="あらすじ" [(ngModel)]="description"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <input matInput type="number" placeholder="評価点" [(ngModel)]="evaluation" />
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="primary" type="button" (click)="addBook()">追加</button>
    </mat-card-actions>
  </mat-card>

  <div *ngIf="bookList.length > 0; else noData">
    @for (book of bookList; track book.title; let index = $index) {
      <app-book-card [book]="book" (delete)="deleteBook(index)"></app-book-card>
    }
  </div>

  <ng-template #noData>
    <p>データがありません</p>
  </ng-template>

  <app-messages></app-messages>
</div>
